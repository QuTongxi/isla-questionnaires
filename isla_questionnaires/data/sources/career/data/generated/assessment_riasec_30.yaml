# These are the OFFICIAL English item texts from the O*NET API reference.
# Vietnamese translations below are derived from official items.
# Scoring: Each item rated 1-5 (Strongly Disagree → Strongly Like).
# RIASEC score = sum of item scores for that dimension, then normalized.

assessment_bank:
  assessment_id: riasec
  version: "onet-ip-30-official-v1"
  locale: en-US
  scoring_version: "det-v3"
  source: "O*NET Interest Profiler Mini-IP (30 items)"
